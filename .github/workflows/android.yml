name: Compilar Gnix APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/gnix]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preparar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Testar e compilar
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verificar assinatura
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Gnix.apk
      # APK de verificação apenas. Cada execução assina com uma chave de depuração
      # efêmera do runner, que NÃO é exportada: material de chave de assinatura
      # nunca sai da CI, porque quem obtém a chave pode assinar um APK malicioso
      # que o Android aceita como atualização legítima do Gnix instalado.
      # O APK instalável e atualizável vem de build-apk.sh, com a chave local.
      - uses: actions/upload-artifact@v4
        with:
          name: Gnix-APK-verificacao
          path: dist/Gnix.apk
